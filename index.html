<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f8">
  <meta name="description" content="סובבו את האות א׳ בתלת־ממד ונסו עליה תשעה חומרים שונים.">
  <title>סטודיו א׳ — חומרים בתלת־ממד</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="mark" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M3 21h8.3l.6-2.8H7.5l2.4-9.1L17.4 21h4.1L10.3 3H5.2L3.3 6.6h3.5L3 21ZM16.1 3l-1.9 3.6h4.6l-1.3 4.4h3.7L23.5 3Z"/></symbol>
  <symbol id="orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-35 12 12)"/><path d="M12 12h.01"/></symbol>
  <symbol id="reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .8 6M4 5v5h5"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14"/></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3m12-6 3 3-3 3"/></symbol>
  <symbol id="zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5M8 10.5h5m-2.5-2.5v5"/></symbol>
  <symbol id="cube" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/></symbol>
</svg>
<div class="shell">
  <header class="topbar">
    <div class="wordmark"><div class="logo"><svg class="icon"><use href="#mark"/></svg></div><span>סטודיו א׳</span></div>
    <span class="mode"><svg class="icon"><use href="#cube"/></svg> סביבת עבודה תלת־ממדית</span>
  </header>
  <main class="layout">
    <section class="preview" aria-label="תצוגת האות בתלת־ממד">
      <div class="stage" id="stage">
        <div id="viewport" tabindex="0" role="region" aria-label="מודל האות א׳. אפשר לסובב עם מקשי החצים ולהתקרב עם פלוס ומינוס."></div>
        <div class="stage-label"><span></span><bdi id="active-material">מתכת</bdi></div>
        <div class="orientation" dir="ltr"><svg class="icon"><use href="#orbit"/></svg> 360°</div>
        <div id="fallback" class="fallback" hidden>תצוגת התלת־ממד דורשת תמיכה ב־WebGL.</div>
        <div class="stage-tools">
          <button id="spin" class="stage-button" type="button" aria-pressed="false"><svg class="icon"><use href="#play"/></svg><span>סיבוב אוטומטי</span></button>
          <button id="reset-view" class="stage-button" type="button"><svg class="icon"><use href="#reset"/></svg><span>איפוס מבט</span></button>
        </div>
      </div>
      <div class="hints"><span><svg class="icon"><use href="#drag"/></svg> גרירה לסיבוב</span><span><svg class="icon"><use href="#zoom"/></svg> גלילה או צביטה לשינוי הזום</span></div>
    </section>
    <aside class="panel" aria-label="הגדרות תצוגה">
      <div class="panel-heading">
        <h1>מעבדת חומרים</h1>
        <p>בחרו חומר וראו איך הוא משנה את האות א׳.</p>
      </div>
      <section aria-labelledby="materials-title">
        <h2 id="materials-title">חומר</h2>
        <div class="materials" id="materials">
          <button class="material" type="button" data-material="metal" aria-pressed="true"><span class="swatch metal"></span><span>מתכת</span><i></i></button>
          <button class="material" type="button" data-material="stone" aria-pressed="false"><span class="swatch stone"></span><span>סלע</span><i></i></button>
          <button class="material" type="button" data-material="mirror" aria-pressed="false"><span class="swatch mirror"></span><span>מראה</span><i></i></button>
          <button class="material" type="button" data-material="fur" aria-pressed="false"><span class="swatch fur"></span><span>פרווה ורודה</span><i></i></button>
          <button class="material" type="button" data-material="liquid" aria-pressed="false"><span class="swatch liquid"></span><span>מים</span><i></i></button>
          <button class="material" type="button" data-material="rubber" aria-pressed="false"><span class="swatch rubber"></span><span>לטקס שחור מבריק</span><i></i></button>
          <button class="material" type="button" data-material="wood" aria-pressed="false"><span class="swatch wood"></span><span>עץ טבעי</span><i></i></button>
          <button class="material" type="button" data-material="graffiti" aria-pressed="false"><span class="swatch graffiti"></span><span>גרפיטי</span><i></i></button>
          <button class="material" type="button" data-material="comic" aria-pressed="false"><span class="swatch comic"></span><span>קומיקס</span><i></i></button>
        </div>
      </section>
      <section class="depth" aria-labelledby="depth-label">
        <div class="section-row"><label for="depth" id="depth-label">עומק האות</label><output for="depth" id="depth-value">46%</output></div>
        <input type="range" id="depth" min="0" max="100" value="46">
      </section>
      <section class="angles" aria-labelledby="angles-title">
        <h2 id="angles-title">זוויות מוכנות</h2>
        <div class="angle-grid">
          <button class="angle" data-angle="0" type="button" aria-label="זווית קדמית מימין" aria-pressed="true"><img src="./assets/view-1.webp" alt=""></button>
          <button class="angle" data-angle="1" type="button" aria-label="זווית נמוכה" aria-pressed="false"><img src="./assets/view-2.webp" alt=""></button>
          <button class="angle" data-angle="2" type="button" aria-label="זווית גבוהה" aria-pressed="false"><img src="./assets/view-3.webp" alt=""></button>
          <button class="angle" data-angle="3" type="button" aria-label="זווית צד" aria-pressed="false"><img src="./assets/view-4.webp" alt=""></button>
        </div>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="./studio.js"></script>
</body>
</html>
